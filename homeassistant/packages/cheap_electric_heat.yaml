        state: >
          {% set v = states('sensor.immersion_heater_voltage') | float(0) %}
          {% set i = states('sensor.immersion_heater_current') | float(0) %}
          {# Return none (not the string "unknown") so the numeric validator is happy. #}
          {% if i > 0.2 and v > 50 %}
            {{ (v / i) | round(3) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Cheap Heat - Immersion Water Temperature Estimate"
        unique_id: cheap_heat_immersion_water_temp_estimate
        unit_of_measurement: "°C"
        state_class: measurement
        device_class: temperature
        icon: mdi:thermometer-water
        state: >
          {% set r_avg = states('sensor.cheap_heat_immersion_resistance_mean_30m') | float(0) %}
          {% set r20 = states('input_number.cheap_heat_immersion_r20_ohm') | float(20.8) %}
