# ============================================================================
# Cheap Electricity Heat Strategy
#
# Tariff: EON Next — cheap rate 6.5 p/kWh from 00:00–06:00, else 28.63 p/kWh.
# Window fires when enable_dynamic_cheap_charging is on AND rate <= threshold.
#
# Room pairing - Tado (gas, disabled during window) → Tuya UFH (electric):
#   climate.kitchen         → climate.kitchen_front + climate.smart_thermostat (kitchen back)
#   climate.master_bathroom → climate.master_bathroom_2  (ensuite UFH)
#   climate.kids_bathroom   → climate.kids_bathroom_2
#   (no Tado equivalent)    → climate.toilet_downstairs
#
# CHEAP -> EXPENSIVE (window closes):
#   Immersion OFF and ALL five Tuya UFH thermostats OFF - unconditionally, not
#   only when the Tado/UFH swap had been armed. Nothing electric keeps drawing
#   once the cheap window is gone.
#
# EXPENSIVE -> CHEAP (window open and confirmed for 5 minutes):
#   Each UFH thermostat is put in heat_cool, which is the only "armed" mode
#   these Tuya devices expose. The thermostat then heats according to the
#   programme saved ON THE DEVICE. HA deliberately does NOT push a target
#   temperature: set_temperature overrides the user's on-device schedule.
#
#   Space-heating arming gate (2026-10-04 fix): the swap branch trusts
#   binary_sensor.cheap_electricity_window_active as the authoritative
#   "is this cheap?" signal. It no longer re-reads the raw household tariff
#   (sensor.eon_next_current_rate_2) and vetoes on rate <= threshold. That
#   raw sensor reports the expensive day rate (e.g. 23.93p Peak) even while
#   E.ON Drive Smart is dispatching genuinely cheap energy into the car, so
#   the old check wrongly blocked space heating during real cheap windows.
#   The window sensor already folds in EV charge dispatch, off-peak tariff,
#   boost and schedule fallback; the gate now just adds outdoor-temp cutoff
#   and heating-demand checks on top of it.
#
# The ElectriQ dehumidifier failed and has been removed from the Tuya app;
# every Home Assistant reference to it has been removed from this package.
#
# Hot water:
#   water_heater.hot_water (Tado) is disabled during the window and the hour before.
#   Immersion heater (switch.immersion_heater) is on during the window.
#   Pre-session disable fires at 23:00 to stop Tado heating water on gas for the
#   hour before the cheap window opens at 00:00.
#
# Kitchen back: sensor unreliable; kitchen front current_temperature drives it.
# ============================================================================

input_boolean:
  enable_dynamic_cheap_charging:
    name: "Enable Dynamic Cheap Charging"
    icon: mdi:cash-clock

  cheap_heat_prev_immersion_on:
    name: "Cheap Heat - Prev Immersion On"
    icon: mdi:water-boiler

  eon_next_boost_session:
    name: "EON Next Boost Session Active"
    icon: mdi:lightning-bolt

  cheap_heat_tado_water_pre_saved:
    name: "Cheap Heat - Tado Water Mode Pre-Saved"
    icon: mdi:water-thermometer

  cheap_heat_space_heating_active:
    name: "Cheap Heat - Space Heating Active"
    icon: mdi:radiator

  # Master switch for the Tado-off / underfloor-on swap only.
  # OFF = immersion + hot water handling still run on cheap power, but Tado
  # radiators and UFH are left completely untouched. Turning it OFF while a
  # swap is running restores Tado and switches UFH off immediately.
  cheap_heat_allow_space_heating_swap:
    name: "Cheap Heat - Allow Tado/UFH Swap"
    icon: mdi:radiator-snowflake

  cheap_heat_override_detected:
    name: "Cheap Heat - Manual Override Detected"
    icon: mdi:alert-circle-outline

  eon_sched_cache_active:
    name: "EON Schedule Cache - Was Active"
    icon: mdi:ev-station

input_text:
  cheap_heat_override_message:
    name: "Cheap Heat - Override Notification Message"
    max: 255

  eon_sched_cache_s1:
    name: "EON Schedule Cache - Slot 1 Start"
    max: 50
  eon_sched_cache_e1:
    name: "EON Schedule Cache - Slot 1 End"
    max: 50
  eon_sched_cache_s2:
    name: "EON Schedule Cache - Slot 2 Start"
    max: 50
  eon_sched_cache_e2:
    name: "EON Schedule Cache - Slot 2 End"
    max: 50

input_number:
  eon_cheap_rate_threshold:
    name: "EON Cheap Rate Threshold"
    min: 1
    max: 40
    step: 0.5
    unit_of_measurement: "p/kWh"
    mode: box
    initial: 12

  cheap_heat_outdoor_temp_cutoff:
    name: "Cheap Heat - Outdoor Temp Cutoff"
    min: 10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 16

  cheap_heat_toilet_temperature:
    name: "Cheap Heat - Toilet Target Temperature"
    min: 15
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 19

  cheap_heat_kitchen_back_hysteresis:
    name: "Cheap Heat - Kitchen Back Hysteresis"
    min: 0.1
    max: 2.0
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial: 0.3

  cheap_heat_saved_kitchen_target:
    name: "Cheap Heat - Saved Kitchen Target"
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    mode: box

  cheap_heat_saved_master_bathroom_target:
    name: "Cheap Heat - Saved Ensuite Target"
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    mode: box

  cheap_heat_saved_kids_bathroom_target:
    name: "Cheap Heat - Saved Kids Bathroom Target"
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    mode: box

  cheap_heat_hot_water_force_off_hours:
    name: "Cheap Heat - Hot Water Force Off Hours"
    min: 0.5
    max: 8
    step: 0.5
    unit_of_measurement: "h"
    mode: box
    initial: 6

  cheap_heat_override_retry_count:
    name: "Cheap Heat - Override Retry Count"
    min: 0
    max: 10
    step: 1
    mode: box
    initial: 0

  cheap_heat_override_max_retries:
    name: "Cheap Heat - Override Max Retries"
    min: 1
    max: 10
    step: 1
    mode: box
    initial: 3

  cheap_heat_immersion_r20_ohm:
    name: "Cheap Heat - Immersion R20 Reference"
    min: 10
    max: 40
    step: 0.1
    unit_of_measurement: "Ω"
    mode: box
    initial: 20.8

  cheap_heat_immersion_tempco:
    name: "Cheap Heat - Immersion Temp Coefficient"
    min: 0.0001
    max: 0.0040
    step: 0.0001
    mode: box
    initial: 0.0004

input_datetime:
  cheap_heat_hot_water_forced_off_until:
    name: "Cheap Heat - Hot Water Forced Off Until"
    has_date: true
    has_time: true

  eon_sched_cache_updated:
    name: "EON Schedule Cache - Last Updated"
    has_date: true
    has_time: true

input_select:
  cheap_heat_prev_tado_kitchen_mode:
    name: "Cheap Heat - Prev Tado Kitchen Mode"
    options: ['off', 'auto', 'heat']

  cheap_heat_prev_tado_master_bathroom_mode:
    name: "Cheap Heat - Prev Tado Ensuite Mode"
    options: ['off', 'auto', 'heat']

  cheap_heat_prev_tado_kids_bathroom_mode:
    name: "Cheap Heat - Prev Tado Kids Bathroom Mode"
    options: ['off', 'auto', 'heat']

  cheap_heat_prev_tado_hot_water_mode:
    name: "Cheap Heat - Prev Tado Hot Water Mode"
    options: ['off', 'auto', 'heat']

sensor:
  - platform: statistics
    name: "Cheap Heat - Immersion Resistance Mean 30m"
    entity_id: sensor.cheap_heat_immersion_resistance_instant
    state_characteristic: mean
    sampling_size: 600
    max_age:
      minutes: 30

template:
  - binary_sensor:
      - name: "Cheap Electricity Window Active"
        unique_id: cheap_electricity_window_active
        state: >
          {% set enabled_state = states('input_boolean.enable_dynamic_cheap_charging') %}
          {% set enabled = enabled_state in ['on','unknown','unavailable'] %}
          {% set boost = is_state('input_boolean.eon_next_boost_session', 'on') %}
          {% set rate = states('sensor.eon_next_current_rate_2') | float(999) %}
          {% set threshold = states('input_number.eon_cheap_rate_threshold') | float(7) %}
          {# --- REAL TARIFF (from the eon_next custom component, GBP/kWh -> p/kWh) --- #}
          {% set real_p = (states('sensor.account_unit_rate') | float(-1) * 100) | round(2) %}
          {% set rate_known = real_p > 0 %}
          {% set off_s = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_start')) if state_attr('sensor.account_unit_rate', 'off_peak_start') not in [none,'unknown','unavailable','none','None',''] else none) %}
          {% set off_e = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_stop')) if state_attr('sensor.account_unit_rate', 'off_peak_stop') not in [none,'unknown','unavailable','none','None',''] else none) %}
          {% set cur_m = now().hour * 60 + now().minute %}
          {% set in_real_offpeak = false %}
          {% if off_s and off_e %}
          {% set sm = (off_s | as_local).hour * 60 + (off_s | as_local).minute %}
          {% set em = (off_e | as_local).hour * 60 + (off_e | as_local).minute %}
          {% if sm == em %}{% set in_real_offpeak = true %}
          {% elif sm < em %}{% set in_real_offpeak = cur_m >= sm and cur_m < em %}
          {% else %}{% set in_real_offpeak = cur_m >= sm or cur_m < em %}
          {% endif %}
          {% endif %}

          {% set sched_raw = states('sensor.ev_smart_charging_schedule') %}
          {% set eon_error = sched_raw in ['unknown','unavailable','none','None','','error'] %}
          {% set no_schedule = sched_raw in ['No schedule','No Schedule','no schedule'] %}
          {% set now_ts = as_timestamp(now()) | float(0) %}
          {# --- HARDENED HOLD: a missing/'No Schedule' schedule may only keep the window #}
          {# alive until the end of the CURRENT 30-min block (measured from when the #}
          {# schedule sensor last changed), and only while we are already inside the #}
          {# cached slot that was running. Never start a NEW session from cache. #}
          {% set sched_state_obj = states['sensor.ev_smart_charging_schedule'] %}
          {% set sched_lost_ts = as_timestamp(sched_state_obj.last_changed) | float(0) %}
          {% set hold_deadline_ts = (((sched_lost_ts + 1799) // 1800) * 1800) if sched_lost_ts > 0 else 0 %}
          {% set cache_ts = as_timestamp(states('input_datetime.eon_sched_cache_updated')) | float(0) %}
          {% set cache_fresh = cache_ts > 0 and (now_ts - cache_ts) < 86400 %}
          {% set cs1 = states('input_text.eon_sched_cache_s1') %}
          {% set ce1 = states('input_text.eon_sched_cache_e1') %}
          {% set cs2 = states('input_text.eon_sched_cache_s2') %}
          {% set ce2 = states('input_text.eon_sched_cache_e2') %}
          {% set cs1_ts = as_timestamp(cs1) if cs1 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set ce1_ts = as_timestamp(ce1) if ce1 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set cs2_ts = as_timestamp(cs2) if cs2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set ce2_ts = as_timestamp(ce2) if ce2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set ce1_hold_ts = ((((ce1_ts + 1799) // 1800) * 1800)) if ce1_ts > 0 else 0 %}
          {% set ce2_hold_ts = ((((ce2_ts + 1799) // 1800) * 1800)) if ce2_ts > 0 else 0 %}
          {# must be INSIDE a cached slot (start-floor bounded), not merely before its end #}
          {% set cached_in_slot_1 = ce1_hold_ts > 0 and now_ts < ce1_hold_ts and (cs1_ts == 0 or now_ts >= ((cs1_ts // 1800) * 1800)) %}
          {% set cached_in_slot_2 = ce2_hold_ts > 0 and now_ts < ce2_hold_ts and (cs2_ts == 0 or now_ts >= ((cs2_ts // 1800) * 1800)) %}
          {% set cached_window_active = cache_fresh and (cached_in_slot_1 or cached_in_slot_2) %}
          {% set sched_hold = (eon_error or no_schedule) and cached_window_active and hold_deadline_ts > 0 and now_ts < hold_deadline_ts %}
          {% if sched_hold %}
          {% set schedule_active = is_state('input_boolean.eon_sched_cache_active', 'on') %}
          {% set s1 = cs1 %}
          {% set e1 = ce1 %}
          {% set s2 = cs2 %}
          {% set e2 = ce2 %}
          {% else %}
          {% set schedule_active = is_state('sensor.ev_smart_charging_schedule', 'Active') %}
          {% set s1 = states('sensor.ev_next_charge_start') %}
          {% set e1 = states('sensor.ev_next_charge_end') %}
          {% set s2 = states('sensor.ev_next_charge_start_2') %}
          {% set e2 = states('sensor.ev_next_charge_end_2') %}
          {% endif %}
          {% set s1_ts = as_timestamp(s1) if s1 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set e1_ts = as_timestamp(e1) if e1 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set s2_ts = as_timestamp(s2) if s2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set e2_ts = as_timestamp(e2) if e2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set e1_effective_ts = ((((e1_ts + 1799) // 1800) * 1800)) if sched_hold and e1_ts > 0 else e1_ts %}
          {% set e2_effective_ts = ((((e2_ts + 1799) // 1800) * 1800)) if sched_hold and e2_ts > 0 else e2_ts %}

          {% set s1_floor = ((s1_ts // 1800) * 1800) if s1_ts > 0 else 0 %}
          {% set s2_floor = ((s2_ts // 1800) * 1800) if s2_ts > 0 else 0 %}
          {% set fixed_clock_window = now().hour < 6 %}

          {# in_slot: end must be in the future; start-floor gates entry but drifts within
             the same 30-min block are tolerated; s1_floor==0 means no start available.
             While holding on a stale schedule, also capped by hold_deadline_ts (block end). #}
          {% set in_slot_1 = e1_effective_ts > 0 and now_ts < e1_effective_ts and (s1_floor == 0 or now_ts >= s1_floor) and ((not sched_hold) or now_ts < hold_deadline_ts) %}
          {% set in_slot_2 = e2_effective_ts > 0 and now_ts < e2_effective_ts and (s2_floor == 0 or now_ts >= s2_floor) and ((not sched_hold) or now_ts < hold_deadline_ts) %}
          {% set ev_window = in_slot_1 or in_slot_2 %}
          {% set ev_fallback = schedule_active and not ev_window and e1_ts == 0 and not (eon_error or no_schedule) %}

          {# An ACTIVE EV charge-dispatch window is authoritative: E.ON Drive Smart
             only dispatches the car during cheap periods, so while a window is
             running we report cheap even though the household tariff rate is
             still the expensive day rate. The tariff rate is only the deciding
             signal when no charge window is active. #}
          {% if not enabled %}off
          {% elif boost %}on
          {% elif ev_window or ev_fallback or in_real_offpeak %}on
          {% elif rate_known %}{% if real_p <= threshold %}on{% else %}off{% endif %}
          {% elif fixed_clock_window %}on
          {% else %}off{% endif %}
        attributes:
          source_rate_p_kwh: "{{ states('sensor.eon_next_current_rate_2') }}"
          real_rate_p_kwh: "{{ state_attr('sensor.eon_next_current_rate_2', 'real_rate_p_kwh') }}"
          real_period: "{{ state_attr('sensor.account_unit_rate', 'current_period') }}"
          real_offpeak_known: >-
            {{ state_attr('sensor.eon_next_current_rate_2', 'real_rate_p_kwh') != 'unavailable' }}
          in_real_offpeak: >-
            {%- set off_s = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_start')) if state_attr('sensor.account_unit_rate', 'off_peak_start') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- set off_e = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_stop')) if state_attr('sensor.account_unit_rate', 'off_peak_stop') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- if off_s and off_e -%}
              {%- set sm = (off_s | as_local).hour * 60 + (off_s | as_local).minute -%}
              {%- set em = (off_e | as_local).hour * 60 + (off_e | as_local).minute -%}
              {%- set cm = now().hour * 60 + now().minute -%}
              {{ (sm == em) or (sm < em and cm >= sm and cm < em) or (sm > em and (cm >= sm or cm < em)) }}
            {%- else -%}unknown{%- endif -%}
          offpeak_local: >-
            {%- set off_s = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_start')) if state_attr('sensor.account_unit_rate', 'off_peak_start') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- set off_e = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_stop')) if state_attr('sensor.account_unit_rate', 'off_peak_stop') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- if off_s and off_e -%}
              {{ (off_s | as_local).strftime('%H:%M') }}-{{ (off_e | as_local).strftime('%H:%M') }}
            {%- else -%}unknown{%- endif -%}
          decision: >-
            {%- set rp = state_attr('sensor.eon_next_current_rate_2', 'real_rate_p_kwh') -%}
            {%- set thr = states('input_number.eon_cheap_rate_threshold') | float(7) -%}
            {%- set off_s = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_start')) if state_attr('sensor.account_unit_rate', 'off_peak_start') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- set off_e = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_stop')) if state_attr('sensor.account_unit_rate', 'off_peak_stop') not in [none,'unknown','unavailable','none','None',''] else none) -%}
            {%- set cm = now().hour * 60 + now().minute -%}
            {%- set in_real_offpeak = false -%}
            {%- if off_s and off_e -%}
              {%- set sm = (off_s | as_local).hour * 60 + (off_s | as_local).minute -%}
              {%- set em = (off_e | as_local).hour * 60 + (off_e | as_local).minute -%}
              {%- if sm == em -%}{%- set in_real_offpeak = true -%}
              {%- elif sm < em -%}{%- set in_real_offpeak = cm >= sm and cm < em -%}
              {%- else -%}{%- set in_real_offpeak = cm >= sm or cm < em -%}
              {%- endif -%}
            {%- endif -%}
            {%- set cs = as_datetime(states('sensor.ev_next_charge_start')) if states('sensor.ev_next_charge_start') not in ['unknown','unavailable','none','None',''] else none -%}
            {%- set ce = as_datetime(states('sensor.ev_next_charge_end')) if states('sensor.ev_next_charge_end') not in ['unknown','unavailable','none','None',''] else none -%}
            {%- set ev_charging = cs is not none and ce is not none and cs <= now() and now() < ce -%}
            {%- if is_state('input_boolean.enable_dynamic_cheap_charging', 'off') -%}disabled
            {%- elif is_state('input_boolean.eon_next_boost_session', 'on') -%}boost
            {%- elif ev_charging -%}cheap (EV charge dispatch active)
            {%- elif in_real_offpeak -%}cheap (off-peak tariff window)
            {%- elif rp not in ['unavailable', 'unknown', 'None', ''] and rp | float(999) <= thr -%}cheap (real tariff {{ rp }}p)
            {%- elif rp not in ['unavailable', 'unknown', 'None', ''] -%}expensive (real tariff {{ rp }}p)
            {%- else -%}tariff_unavailable (fallback logic)
            {%- endif -%}
          threshold_p_kwh: "{{ states('input_number.eon_cheap_rate_threshold') }}"
          gate_state: "{{ states('input_boolean.enable_dynamic_cheap_charging') }}"
          schedule_cache_active: >
            {% set sched_raw = states('sensor.ev_smart_charging_schedule') %}
            {% set eon_error = sched_raw in ['unknown','unavailable','none','None','','error'] %}
            {% set no_schedule = sched_raw in ['No schedule','No Schedule','no schedule'] %}
            {% set now_ts = as_timestamp(now()) | float(0) %}
            {% set sched_state_obj = states['sensor.ev_smart_charging_schedule'] %}
            {% set sched_lost_ts = as_timestamp(sched_state_obj.last_changed) | float(0) %}
            {% set hold_deadline_ts = (((sched_lost_ts + 1799) // 1800) * 1800) if sched_lost_ts > 0 else 0 %}
            {% set cache_ts = as_timestamp(states('input_datetime.eon_sched_cache_updated')) | float(0) %}
            {% set cache_fresh = cache_ts > 0 and (now_ts - cache_ts) < 86400 %}
            {% set cs1 = states('input_text.eon_sched_cache_s1') %}
            {% set ce1 = states('input_text.eon_sched_cache_e1') %}
            {% set cs2 = states('input_text.eon_sched_cache_s2') %}
            {% set ce2 = states('input_text.eon_sched_cache_e2') %}
            {% set cs1_ts = as_timestamp(cs1) if cs1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_ts = as_timestamp(ce1) if ce1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set cs2_ts = as_timestamp(cs2) if cs2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce2_ts = as_timestamp(ce2) if ce2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_hold_ts = ((((ce1_ts + 1799) // 1800) * 1800)) if ce1_ts > 0 else 0 %}
            {% set ce2_hold_ts = ((((ce2_ts + 1799) // 1800) * 1800)) if ce2_ts > 0 else 0 %}
            {% set cached_in_slot_1 = ce1_hold_ts > 0 and now_ts < ce1_hold_ts and (cs1_ts == 0 or now_ts >= ((cs1_ts // 1800) * 1800)) %}
            {% set cached_in_slot_2 = ce2_hold_ts > 0 and now_ts < ce2_hold_ts and (cs2_ts == 0 or now_ts >= ((cs2_ts // 1800) * 1800)) %}
            {% set cached_window_active = cache_fresh and (cached_in_slot_1 or cached_in_slot_2) %}
            {{ (eon_error or no_schedule) and cached_window_active and hold_deadline_ts > 0 and now_ts < hold_deadline_ts }}
          ev_schedule_state: >
            {% set sched_raw = states('sensor.ev_smart_charging_schedule') %}
            {% set eon_error = sched_raw in ['unknown','unavailable','none','None','','error'] %}
            {% set no_schedule = sched_raw in ['No schedule','No Schedule','no schedule'] %}
            {% set now_ts = as_timestamp(now()) | float(0) %}
            {% set sched_state_obj = states['sensor.ev_smart_charging_schedule'] %}
            {% set sched_lost_ts = as_timestamp(sched_state_obj.last_changed) | float(0) %}
            {% set hold_deadline_ts = (((sched_lost_ts + 1799) // 1800) * 1800) if sched_lost_ts > 0 else 0 %}
            {% set cache_ts = as_timestamp(states('input_datetime.eon_sched_cache_updated')) | float(0) %}
            {% set cache_fresh = cache_ts > 0 and (now_ts - cache_ts) < 86400 %}
            {% set cs1 = states('input_text.eon_sched_cache_s1') %}
            {% set ce1 = states('input_text.eon_sched_cache_e1') %}
            {% set cs2 = states('input_text.eon_sched_cache_s2') %}
            {% set ce2 = states('input_text.eon_sched_cache_e2') %}
            {% set cs1_ts = as_timestamp(cs1) if cs1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_ts = as_timestamp(ce1) if ce1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set cs2_ts = as_timestamp(cs2) if cs2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce2_ts = as_timestamp(ce2) if ce2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_hold_ts = ((((ce1_ts + 1799) // 1800) * 1800)) if ce1_ts > 0 else 0 %}
            {% set ce2_hold_ts = ((((ce2_ts + 1799) // 1800) * 1800)) if ce2_ts > 0 else 0 %}
            {% set cached_in_slot_1 = ce1_hold_ts > 0 and now_ts < ce1_hold_ts and (cs1_ts == 0 or now_ts >= ((cs1_ts // 1800) * 1800)) %}
            {% set cached_in_slot_2 = ce2_hold_ts > 0 and now_ts < ce2_hold_ts and (cs2_ts == 0 or now_ts >= ((cs2_ts // 1800) * 1800)) %}
            {% set cached_window_active = cache_fresh and (cached_in_slot_1 or cached_in_slot_2) %}
            {% set sched_hold = (eon_error or no_schedule) and cached_window_active and hold_deadline_ts > 0 and now_ts < hold_deadline_ts %}
            {% if sched_hold %}cached-hold ({{ sched_raw }}){% elif eon_error or no_schedule %}{{ sched_raw }} (hold expired){% else %}{{ sched_raw }}{% endif %}
          reason: >
            {% set boost = is_state('input_boolean.eon_next_boost_session', 'on') %}
            {% set rate = states('sensor.eon_next_current_rate_2') | float(999) %}
            {% set threshold = states('input_number.eon_cheap_rate_threshold') | float(7) %}
            {% set real_p = (states('sensor.account_unit_rate') | float(-1) * 100) | round(2) %}
            {% set off_s = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_start')) if state_attr('sensor.account_unit_rate', 'off_peak_start') not in [none,'unknown','unavailable','none','None',''] else none) %}
            {% set off_e = (as_datetime(state_attr('sensor.account_unit_rate', 'off_peak_stop')) if state_attr('sensor.account_unit_rate', 'off_peak_stop') not in [none,'unknown','unavailable','none','None',''] else none) %}
            {% set cur_m = now().hour * 60 + now().minute %}
            {% set in_real_offpeak = false %}
            {% if off_s and off_e %}
            {% set sm = (off_s | as_local).hour * 60 + (off_s | as_local).minute %}
            {% set em = (off_e | as_local).hour * 60 + (off_e | as_local).minute %}
            {% if sm == em %}{% set in_real_offpeak = true %}
            {% elif sm < em %}{% set in_real_offpeak = cur_m >= sm and cur_m < em %}
            {% else %}{% set in_real_offpeak = cur_m >= sm or cur_m < em %}
            {% endif %}
            {% endif %}
            {% set sched_raw = states('sensor.ev_smart_charging_schedule') %}
            {% set eon_error = sched_raw in ['unknown','unavailable','none','None','','error'] %}
            {% set no_schedule = sched_raw in ['No schedule','No Schedule','no schedule'] %}
            {% set now_ts = as_timestamp(now()) | float(0) %}
            {% set sched_state_obj = states['sensor.ev_smart_charging_schedule'] %}
            {% set sched_lost_ts = as_timestamp(sched_state_obj.last_changed) | float(0) %}
            {% set hold_deadline_ts = (((sched_lost_ts + 1799) // 1800) * 1800) if sched_lost_ts > 0 else 0 %}
            {% set cache_ts = as_timestamp(states('input_datetime.eon_sched_cache_updated')) | float(0) %}
            {% set cache_fresh = cache_ts > 0 and (now_ts - cache_ts) < 86400 %}
            {% set cs1 = states('input_text.eon_sched_cache_s1') %}
            {% set ce1 = states('input_text.eon_sched_cache_e1') %}
            {% set cs2 = states('input_text.eon_sched_cache_s2') %}
            {% set ce2 = states('input_text.eon_sched_cache_e2') %}
            {% set cs1_ts = as_timestamp(cs1) if cs1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_ts = as_timestamp(ce1) if ce1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set cs2_ts = as_timestamp(cs2) if cs2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce2_ts = as_timestamp(ce2) if ce2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set ce1_hold_ts = ((((ce1_ts + 1799) // 1800) * 1800)) if ce1_ts > 0 else 0 %}
            {% set ce2_hold_ts = ((((ce2_ts + 1799) // 1800) * 1800)) if ce2_ts > 0 else 0 %}
            {% set cached_in_slot_1 = ce1_hold_ts > 0 and now_ts < ce1_hold_ts and (cs1_ts == 0 or now_ts >= ((cs1_ts // 1800) * 1800)) %}
            {% set cached_in_slot_2 = ce2_hold_ts > 0 and now_ts < ce2_hold_ts and (cs2_ts == 0 or now_ts >= ((cs2_ts // 1800) * 1800)) %}
            {% set cached_window_active = cache_fresh and (cached_in_slot_1 or cached_in_slot_2) %}
            {% set sched_hold = (eon_error or no_schedule) and cached_window_active and hold_deadline_ts > 0 and now_ts < hold_deadline_ts %}
            {% if sched_hold %}
            {% set schedule_active = is_state('input_boolean.eon_sched_cache_active', 'on') %}
            {% set s1 = cs1 %}
            {% set e1 = ce1 %}
            {% set s2 = cs2 %}
            {% set e2 = ce2 %}
            {% else %}
            {% set schedule_active = is_state('sensor.ev_smart_charging_schedule', 'Active') %}
            {% set s1 = states('sensor.ev_next_charge_start') %}
            {% set e1 = states('sensor.ev_next_charge_end') %}
            {% set s2 = states('sensor.ev_next_charge_start_2') %}
            {% set e2 = states('sensor.ev_next_charge_end_2') %}
            {% endif %}
            {% set s1_ts = as_timestamp(s1) if s1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set e1_ts = as_timestamp(e1) if e1 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set s2_ts = as_timestamp(s2) if s2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set e2_ts = as_timestamp(e2) if e2 not in ['unknown','unavailable','none','None',''] else 0 %}
            {% set e1_effective_ts = ((((e1_ts + 1799) // 1800) * 1800)) if sched_hold and e1_ts > 0 else e1_ts %}
            {% set e2_effective_ts = ((((e2_ts + 1799) // 1800) * 1800)) if sched_hold and e2_ts > 0 else e2_ts %}
            {% set s1_floor = ((s1_ts // 1800) * 1800) if s1_ts > 0 else 0 %}
            {% set s2_floor = ((s2_ts // 1800) * 1800) if s2_ts > 0 else 0 %}
            {% set fixed_clock_window = now().hour < 6 %}
            {% set in_slot_1 = e1_effective_ts > 0 and now_ts < e1_effective_ts and (s1_floor == 0 or now_ts >= s1_floor) and ((not sched_hold) or now_ts < hold_deadline_ts) %}
            {% set in_slot_2 = e2_effective_ts > 0 and now_ts < e2_effective_ts and (s2_floor == 0 or now_ts >= s2_floor) and ((not sched_hold) or now_ts < hold_deadline_ts) %}
            {% set ev_window = in_slot_1 or in_slot_2 %}
            {% set ev_fallback = schedule_active and not ev_window and e1_ts == 0 and not (eon_error or no_schedule) %}
            {% if boost %}
              eon_next_boost_session
            {% elif ev_window %}
              ev_charge_dispatch_active
            {% elif ev_fallback %}
              ev_schedule_active_fallback
            {% elif in_real_offpeak %}
              real_tariff_off_peak
            {% elif real_p > 0 and real_p <= threshold %}
              cheap_rate_{{ real_p }}p
            {% elif real_p > 0 %}
              real_tariff_expensive_{{ real_p }}p
            {% elif fixed_clock_window %}
              fallback_clock_window_0000_0600
            {% elif eon_error or no_schedule %}
              sched_unavailable_hold_expired
            {% else %}
              expensive_rate
            {% endif %}
