          {% else %}
          {% set schedule_active = is_state('sensor.ev_smart_charging_schedule', 'Active') %}
          {% set s1 = states('sensor.ev_next_charge_start') %}
          {% set e1 = states('sensor.ev_next_charge_end') %}
          {% set s2 = states('sensor.ev_next_charge_start_2') %}
          {% set e2 = states('sensor.ev_next_charge_end_2') %}
          {% endif %}
