          {% set i_current = states('sensor.immersion_heater_current') | float(0) %}
          {% set is_heating = i_current > 0.5 %}
          {% if is_heating and r_avg > 0 and r20 > 0 and alpha > 0 %}
            {% set t = 20 + (((r_avg / r20) - 1) / alpha) %}
