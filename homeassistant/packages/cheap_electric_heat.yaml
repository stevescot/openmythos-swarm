          {% set cs2_ts = as_timestamp(cs2) if cs2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set ce2_ts = as_timestamp(ce2) if ce2 not in ['unknown','unavailable','none','None',''] else 0 %}
          {% set ce1_hold_ts = ((((ce1_ts + 1799) // 1800) * 1800)) if ce1_ts > 0 else 0 %}
          {% set ce2_hold_ts = ((((ce2_ts + 1799) // 1800) * 1800)) if ce2_ts > 0 else 0 %}
          {% set cached_in_slot_1 = ce1_hold_ts > 0 and now_ts < ce1_hold_ts and (cs1_ts == 0 or now_ts >= ((cs1_ts // 1800) * 1800)) %}
          {% set cached_in_slot_2 = ce2_hold_ts > 0 and now_ts < ce2_hold_ts and (cs2_ts == 0 or now_ts >= ((cs2_ts // 1800) * 1800)) %}
          {% set cached_window_active = cache_fresh and (cached_in_slot_1 or cached_in_slot_2) %}
          {% set sched_hold = (eon_error or no_schedule) and cached_window_active and hold_deadline_ts > 0 and now_ts < hold_deadline_ts %}
          {% if sched_hold %}
          {% set schedule_active = is_state('input_boolean.eon_sched_cache_active', 'on') %}
          {% set s1 = cs1 %}
          {% set e1 = ce1 %}
